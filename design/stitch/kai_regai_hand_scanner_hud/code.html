<script>
  (function() {
    const autoBtn = document.getElementById('mode-auto');
    const manualBtn = document.getElementById('mode-manual');
    const shutter = document.getElementById('shutter-trigger');
    const torchBtn = document.getElementById('torch-btn');
    let torchActive = false;

    if (autoBtn && manualBtn) {
      autoBtn.addEventListener('click', function() {
        autoBtn.className = "px-4 py-1.5 rounded-full bg-primary-container text-on-primary font-label-md text-label-md font-semibold transition-all shadow-sm";
        manualBtn.className = "px-4 py-1.5 rounded-full text-on-surface-variant hover:text-on-surface font-label-md text-label-md transition-all";
      });

      manualBtn.addEventListener('click', function() {
        manualBtn.className = "px-4 py-1.5 rounded-full bg-primary-container text-on-primary font-label-md text-label-md font-semibold transition-all shadow-sm";
        autoBtn.className = "px-4 py-1.5 rounded-full text-on-surface-variant hover:text-on-surface font-label-md text-label-md transition-all";
      });
    }

    if (torchBtn) {
      torchBtn.addEventListener('click', function() {
        torchActive = !torchActive;
        if (torchActive) {
          torchBtn.classList.remove('bg-surface-container-high/80', 'text-on-surface');
          torchBtn.classList.add('bg-secondary', 'text-on-secondary');
        } else {
          torchBtn.classList.remove('bg-secondary', 'text-on-secondary');
          torchBtn.classList.add('bg-surface-container-high/80', 'text-on-surface');
        }
      });
    }

    if (shutter) {
      shutter.addEventListener('click', function() {
        shutter.classList.add('scale-90');
        setTimeout(() => shutter.classList.remove('scale-90'), 180);
      });
    }
  })();
